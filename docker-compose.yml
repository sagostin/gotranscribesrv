# ============================================================
# GoTranscribeSrv — Docker Compose
# ============================================================
# Runs Go API server + Postgres in Docker.
# Swift + Python sidecars run natively on the host for CoreML/ANE access.
#
# Usage:
#   make up              # Start Postgres + Go server
#   make swift-sidecar   # Start native Swift sidecar (separate terminal)
# ============================================================

# ── Logging defaults ──────────────────────────────────────
# Cap per-service logs at 3 × 10 MB (~30 MB max per container)
# so a runaway logging loop can't fill the host disk. Set
# LOG_MAX_SIZE / LOG_MAX_FILE in .env to override. See:
#   https://docs.docker.com/config/containers/logging/json-file/
x-logging: &logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

services:
  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcribesrv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_db_password}
      POSTGRES_DB: ${POSTGRES_DB:-transcribesrv}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transcribesrv}"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *logging

  # ── Go API Server ────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      presidio-analyzer:
        condition: service_started
    environment:
      PORT: ${PORT:-3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://transcribesrv:changeme_db_password@db:5432/transcribesrv?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_TO_A_RANDOM_64_CHAR_STRING}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      # Swift sidecar runs natively on the host for CoreML/ANE acceleration
      SWIFT_SIDECAR_URL: ${SWIFT_SIDECAR_URL:-http://host.docker.internal:8101}
      SWIFT_SIDECAR_WS_URL: ${SWIFT_SIDECAR_WS_URL:-ws://host.docker.internal:8101}
      # PII redaction — Presidio analyzer runs in the compose stack.
      # To centralize, override PRESIDIO_ANALYZER_URL with an external endpoint.
      ENABLE_PII: ${ENABLE_PII:-true}
      PRESIDIO_ANALYZER_URL: ${PRESIDIO_ANALYZER_URL:-http://presidio-analyzer:3000}
      PRESIDIO_TIMEOUT_MS: ${PRESIDIO_TIMEOUT_MS:-3000}
      PII_ENTITIES: ${PII_ENTITIES:-}
      PII_SCORE_THRESHOLD: ${PII_SCORE_THRESHOLD:-0.6}
      RATE_LIMIT_FREE: ${RATE_LIMIT_FREE:-20}
      RATE_LIMIT_PRO: ${RATE_LIMIT_PRO:-120}
      RATE_LIMIT_ENTERPRISE: ${RATE_LIMIT_ENTERPRISE:-0}
      VOICES_DATA_DIR: ${VOICES_DATA_DIR:-/app/data/voices}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      # Loki logging (optional). Disabled by default — see docs/loki.md.
      # LOKI_PUSH_URL must be reachable from the server container; for a
      # Loki stack started by another docker-compose file on the same
      # network, use the service name (e.g. http://loki:3100).
      LOKI_ENABLED: ${LOKI_ENABLED:-false}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://loki:3100}
      LOKI_USERNAME: ${LOKI_USERNAME:-}
      LOKI_PASSWORD: ${LOKI_PASSWORD:-}
      LOKI_JOB: ${LOKI_JOB:-gotranscribesrv}
      SERVER_ID: ${SERVER_ID:-}
    volumes:
      - voicedata:/app/data/voices
    ports:
      - "${PORT:-3000}:3000"
    logging: *logging

  # ── Presidio Analyzer (PII detection for log redaction) ────────
  # Microsoft's official Presidio analyzer image. Returns entity
  # spans via POST /analyze; we do the <TYPE> replacement in Go.
  # Docs: https://microsoft.github.io/presidio/
  #
  # Networking: the Go server in `server` reaches Presidio via the
  # compose service name `presidio-analyzer:3000` (Docker-internal DNS).
  # The host-published port `127.0.0.1:5002:3000` is bound to localhost
  # ONLY — bind on all interfaces (0.0.0.0) would expose the analyzer's
  # HTTP API on the LAN, which we don't want. For ad-hoc debugging:
  #   curl http://localhost:5002/health
  #   docker logs -f gotranscribesrv-presidio
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: gotranscribesrv-presidio
    restart: unless-stopped
    ports:
      # localhost-only — see comment above. The Go server does NOT use
      # this port; it talks to the analyzer via the service name.
      - "127.0.0.1:5002:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

volumes:
  pgdata:
    driver: local
  voicedata:
    driver: local
